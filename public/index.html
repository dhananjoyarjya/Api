<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075e54">
<title>WhatsApp Business Inbox</title>
<style>
:root{--bg:#f3f6f8;--panel:#fff;--text:#17212b;--muted:#667781;--line:#e5e9ed;--green:#087f68;--green2:#d9fdd3;--nav:#075e54;--shadow:0 8px 28px #14202b0d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #20a890;outline-offset:2px}.app{min-height:100dvh;display:grid;grid-template-columns:72px 280px minmax(0,1fr);max-width:1800px;margin:auto;background:var(--panel);box-shadow:var(--shadow)}.rail{background:var(--nav);color:white;display:flex;flex-direction:column;align-items:center;padding:16px 8px;gap:12px}.brand{width:42px;height:42px;border-radius:14px;background:#fff;color:var(--nav);display:grid;place-items:center;font-size:23px;font-weight:800;margin-bottom:14px}.rail button{width:48px;height:46px;border-radius:13px;background:transparent;color:#d5eee8;font-size:20px}.rail button.active,.rail button:hover{background:#ffffff24;color:white}.rail .bottom{margin-top:auto}.sidebar{border-right:1px solid var(--line);min-width:0;display:flex;flex-direction:column}.sidehead{padding:20px 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}.sidehead h1{font-size:20px;margin:0}.pill{font-size:11px;border-radius:20px;padding:4px 8px;background:#e8f6f2;color:#087f68;font-weight:700}.search{padding:0 12px 12px}.search input{width:100%;border:1px solid var(--line);background:#f7f9fa;border-radius:12px;padding:11px 12px}.filters{display:flex;gap:6px;padding:0 12px 12px;overflow:auto}.filter{white-space:nowrap;padding:7px 10px;border-radius:20px;background:#f1f4f5;color:var(--muted);font-size:12px}.filter.active{background:#d8f3eb;color:#056653;font-weight:700}.chatlist{overflow:auto;flex:1}.chatrow{display:flex;gap:11px;padding:13px 12px;border-top:1px solid #f0f2f3;cursor:pointer}.chatrow:hover,.chatrow.active{background:#edf7f4}.avatar{width:42px;height:42px;border-radius:50%;background:#d6eee7;color:#086653;display:grid;place-items:center;font-weight:800;flex-shrink:0}.chatmeta{min-width:0;flex:1}.chatline{display:flex;justify-content:space-between;gap:8px}.chatname{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.time{font-size:11px;color:var(--muted);white-space:nowrap}.preview{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}.unread{background:#16a085;color:white;min-width:19px;height:19px;border-radius:20px;display:inline-grid;place-items:center;font-size:11px;padding:0 5px;margin-left:5px}.main{display:flex;min-width:0;min-height:100dvh;flex-direction:column;background:#f7f9fa}.topbar{height:72px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:12px}.topbar .who{min-width:0;flex:1}.topbar strong{display:block;font-size:15px}.topbar small{color:var(--muted)}.btn{border-radius:10px;padding:9px 12px;background:#edf2f3;color:#33434b;font-weight:650}.btn.primary{background:var(--green);color:white}.btn.ghost{background:transparent;border:1px solid var(--line)}.btn.danger{background:#fff0f0;color:#b42318}.content{padding:20px;overflow:auto;flex:1}.empty{height:100%;min-height:360px;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px}.empty .big{font-size:54px;margin-bottom:10px}.messages{display:flex;flex-direction:column;gap:10px;max-width:900px;margin:auto}.day{text-align:center;color:#65747b;font-size:11px;margin:8px auto;background:#fff;padding:5px 10px;border-radius:9px}.bubble{max-width:min(76%,620px);padding:10px 12px;border-radius:13px;background:white;box-shadow:0 1px 2px #0000000b;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.out{align-self:flex-end;background:var(--green2)}.bubble.in{align-self:flex-start}.bubble .stamp{display:block;text-align:right;color:#718078;font-size:10px;margin-top:5px}.composer{padding:12px 16px;background:white;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end}.composer textarea{resize:none;min-height:44px;max-height:130px;flex:1;border:1px solid var(--line);border-radius:12px;padding:12px;background:#f8fafb}.compose-tools{display:flex;gap:6px}.notice{padding:12px 14px;background:#fff8e6;border:1px solid #f6df9a;border-radius:12px;color:#73591b;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}.card h3{margin:0 0 8px;font-size:14px}.metric{font-size:28px;font-weight:800}.muted{color:var(--muted)}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.section-title h2{margin:0;font-size:22px}.stack{display:grid;gap:12px}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:700;color:#50616a}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff;color:var(--text)}.field textarea{min-height:90px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.quicklist,.label-list,.product-list{display:grid;gap:8px}.item{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px;background:white}.item .grow{flex:1;min-width:0}.item p{margin:3px 0 0;color:var(--muted);font-size:12px;overflow-wrap:anywhere}.tag{font-size:11px;padding:4px 8px;border-radius:20px;background:#eaf5f2;color:#087f68}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#17212b;color:white;padding:11px 16px;border-radius:12px;z-index:99;box-shadow:var(--shadow);max-width:90vw}.toast.error{background:#9d2929}.mobile-back{display:none}.hidden{display:none!important}.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#1baa79;margin-right:6px}.status-dot.off{background:#dc8b24}.small{font-size:12px}.footer-note{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5}
@media(max-width:900px){.app{grid-template-columns:58px 240px minmax(0,1fr)}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:14px}.topbar{padding:0 12px}}
@media(max-width:650px){.app{display:block;min-height:100dvh}.rail{position:fixed;z-index:10;left:0;right:0;bottom:0;height:60px;flex-direction:row;justify-content:space-around;padding:5px 8px;gap:2px}.brand{display:none}.rail button{height:46px;width:48px}.rail .bottom{margin:0}.sidebar{height:calc(100dvh - 60px);border:0}.main{display:none;height:calc(100dvh - 60px);min-height:0}.app.show-chat .sidebar{display:none}.app.show-chat .main{display:flex}.app.show-chat .rail{display:none}.mobile-back{display:inline-flex}.topbar{height:64px}.content{padding:12px}.grid{grid-template-columns:1fr 1fr;gap:8px}.card{padding:13px}.metric{font-size:23px}.formgrid{grid-template-columns:1fr}.bubble{max-width:88%}.composer{padding:9px}.composer .btn{padding:10px}.sidehead{padding-top:16px}}
</style>
</head>
<body>
<div class="app" id="app">
<nav class="rail" aria-label="Main navigation">
  <div class="brand">W</div>
  <button class="active" data-page="inbox" title="Inbox" aria-label="Inbox">☏</button>
  <button data-page="dashboard" title="Dashboard" aria-label="Dashboard">▦</button>
  <button data-page="contacts" title="Customers" aria-label="Customers">♙</button>
  <button data-page="catalog" title="Catalog" aria-label="Catalog">▤</button>
  <button data-page="quick" title="Quick replies" aria-label="Quick replies">⚡</button>
  <button data-page="settings" title="Settings" aria-label="Settings">⚙</button>
  <button class="bottom" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">◐</button>
</nav>
<aside class="sidebar" id="sidebar">
  <div class="sidehead"><h1>Inbox</h1><span class="pill" id="connectionPill">Checking…</span></div>
  <div class="search"><input id="chatSearch" type="search" placeholder="Search chats or phone…" aria-label="Search chats"></div>
  <div class="filters"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="unread">Unread</button><button class="filter" data-filter="label">Labeled</button></div>
  <div class="chatlist" id="chatList"><div class="empty">Loading conversations…</div></div>
</aside>
<main class="main" id="main">
  <header class="topbar" id="topbar"><div class="who"><strong>WhatsApp Business Inbox</strong><small>Choose a chat to start replying</small></div><button class="btn ghost" data-page="settings">Settings</button></header>
  <section class="content" id="content"><div class="empty"><div><div class="big">💬</div><h2>Your customer inbox</h2><p>Select a conversation on the left to view messages and reply.</p><p class="small">This interface connects to your own backend at <code>/api</code>.</p></div></div></section>
  <form class="composer hidden" id="composer"><button type="button" class="btn ghost" id="quickBtn" title="Insert quick reply">⚡</button><textarea id="messageInput" rows="1" placeholder="Type a message…" aria-label="Message"></textarea><button class="btn primary" type="submit" id="sendBtn">Send ➤</button></form>
</main>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const state = {chats:[],activePhone:null,messages:[],page:'inbox',filter:'all',query:'',status:{},labels:load('wbi_labels',{}),quick:load('wbi_quick',[{shortcut:'/hello',text:'Hello! Thank you for contacting us. How can we help you?'},{shortcut:'/delivery',text:'Please share your location or PIN code so we can confirm delivery availability.'}]),products:load('wbi_products',[]),theme:load('wbi_theme','light'),poll:null};
function load(k, fallback){try{const v=localStorage.getItem(k);return v?JSON.parse(v):fallback}catch{return fallback}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function phoneOf(c){return String(c.phone||c.id||'')}
function displayName(c){return c.name && c.name!==phoneOf(c)?c.name:phoneOf(c)}
function fmtTime(v){if(!v)return '';let d=new Date(v);return isNaN(d)?'':d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}
function toast(msg,error=false){const el=$('#toast');el.textContent=msg;el.classList.toggle('error',error);el.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),3200)}
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.error||`Request failed (${r.status})`);return data}
function applyTheme(){document.documentElement.style.colorScheme=state.theme;document.body.style.background=state.theme==='dark'?'#111b21':'';document.body.style.color=state.theme==='dark'?'#e9edef':'';if(state.theme==='dark'){document.documentElement.style.setProperty('--bg','#111b21');document.documentElement.style.setProperty('--panel','#202c33');document.documentElement.style.setProperty('--text','#e9edef');document.documentElement.style.setProperty('--muted','#aebac1');document.documentElement.style.setProperty('--line','#34434b');document.documentElement.style.setProperty('--green2','#174f43')}else{document.documentElement.style.setProperty('--bg','#f3f6f8');document.documentElement.style.setProperty('--panel','#fff');document.documentElement.style.setProperty('--text','#17212b');document.documentElement.style.setProperty('--muted','#667781');document.documentElement.style.setProperty('--line','#e5e9ed');document.documentElement.style.setProperty('--green2','#d9fdd3')}save('wbi_theme',state.theme)}
function labelOf(phone){return state.labels[phone]||''}
function renderChats(){let chats=state.chats.filter(c=>{const p=phoneOf(c),q=state.query.toLowerCase();if(q&&!`${displayName(c)} ${p} ${c.lastMessage||''}`.toLowerCase().includes(q))return false;if(state.filter==='unread'&&!Number(c.unreadCount))return false;if(state.filter==='label'&&!labelOf(p))return false;return true});const el=$('#chatList');if(!chats.length){el.innerHTML='<div class="empty">No conversations found.<br><span class="small">Incoming messages appear after the webhook saves them.</span></div>';return}el.innerHTML=chats.map(c=>{const p=phoneOf(c),active=p===state.activePhone;return `<div class="chatrow ${active?'active':''}" data-phone="${esc(p)}"><div class="avatar">${esc(displayName(c).slice(0,1).toUpperCase()||'?')}</div><div class="chatmeta"><div class="chatline"><span class="chatname">${esc(displayName(c))}</span><span class="time">${esc(fmtTime(c.lastMessageAt))}</span></div><div class="preview">${labelOf(p)?`<span class="tag">${esc(labelOf(p))}</span> `:''}${esc(c.lastMessage||'No messages yet')}${Number(c.unreadCount)>0?` <span class="unread">${Number(c.unreadCount)}</span>`:''}</div></div></div>`}).join('')}
async function refreshStatus(){try{state.status=await api('/api/status');const ok=state.status.whatsappConfigured;$('#connectionPill').textContent=ok?'API ready':'API not configured';$('#connectionPill').style.background=ok?'#e8f6f2':'#fff1d6';$('#connectionPill').style.color=ok?'#087f68':'#986300'}catch{$('#connectionPill').textContent='Server offline';$('#connectionPill').style.background='#ffe9e9';$('#connectionPill').style.color='#a21c1c'}}
async function refreshChats(){try{const data=await api('/api/chats');state.chats=Array.isArray(data)?data:[];renderChats();if(state.activePhone){const c=state.chats.find(x=>phoneOf(x)===state.activePhone);if(c&&state.page==='inbox')updateChatHeader(c)}}catch(e){$('#chatList').innerHTML=`<div class="empty"><div><div class="big">⚠️</div><b>Could not load chats</b><p>${esc(e.message)}</p><p class="small">Check Render deployment and Firebase configuration.</p><button class="btn" onclick="location.reload()">Retry</button></div></div>`}}
function updateChatHeader(c){$('#topbar').innerHTML=`<button class="btn ghost mobile-back" id="backBtn" aria-label="Back">←</button><div class="avatar">${esc(displayName(c).slice(0,1).toUpperCase())}</div><div class="who"><strong>${esc(displayName(c))}</strong><small>${esc(phoneOf(c))} · ${labelOf(phoneOf(c))?esc(labelOf(phoneOf(c))):'WhatsApp conversation'}</small></div><button class="btn ghost" id="labelBtn">🏷 Label</button><button class="btn ghost" id="markReadBtn">✓ Read</button>`;$('#backBtn')?.addEventListener('click',()=>$('#app').classList.remove('show-chat'));$('#labelBtn').addEventListener('click',editLabel);$('#markReadBtn').addEventListener('click',markRead)}
async function openChat(phone){state.activePhone=phone;state.page='inbox';$('#app').classList.add('show-chat');$$('.rail [data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page==='inbox'));const c=state.chats.find(x=>phoneOf(x)===phone)||{phone,name:phone};updateChatHeader(c);$('#composer').classList.remove('hidden');$('#content').innerHTML='<div class="empty">Loading messages…</div>';renderChats();try{state.messages=await api(`/api/chats/${encodeURIComponent(phone)}/messages`);renderMessages();}catch(e){$('#content').innerHTML=`<div class="empty">Could not load messages: ${esc(e.message)}</div>`}try{await api(`/api/chats/${encodeURIComponent(phone)}/read`,{method:'POST',body:'{}'});const chat=state.chats.find(x=>phoneOf(x)===phone);if(chat)chat.unreadCount=0;renderChats()}catch{}}
function renderMessages(){const el=$('#content');if(!state.messages.length){el.innerHTML='<div class="empty"><div><div class="big">👋</div><h3>Start the conversation</h3><p>No saved messages for this chat yet.</p></div></div>';return}el.innerHTML=`<div class="messages">${state.messages.map(m=>`<div class="bubble ${m.direction==='outgoing'?'out':'in'}">${esc(m.text||`[${m.type||'message'}]`)}<span class="stamp">${esc(fmtTime(m.timestamp))}${m.direction==='outgoing'?' · Sent':''}</span></div>`).join('')}</div>`;el.scrollTop=el.scrollHeight}
function updateChatInMemory(phone,text,direction){let c=state.chats.find(x=>phoneOf(x)===phone);if(!c){c={id:phone,phone,name:phone,unreadCount:0};state.chats.unshift(c)}c.lastMessage=text;c.lastMessageAt=new Date().toISOString();if(direction==='incoming')c.unreadCount=(c.unreadCount||0)+1;renderChats()}
$('#composer').addEventListener('submit',async e=>{e.preventDefault();const text=$('#messageInput').value.trim(),to=state.activePhone;if(!to||!text)return;const btn=$('#sendBtn');btn.disabled=true;btn.textContent='Sending…';try{const result=await api('/api/messages',{method:'POST',body:JSON.stringify({to,text})});$('#messageInput').value='';toast('Message accepted by WhatsApp API');await openChat(to);await refreshChats()}catch(err){toast(err.message,true)}finally{btn.disabled=false;btn.textContent='Send ➤'}});
$('#messageInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#composer').requestSubmit()}});
$('#chatSearch').addEventListener('input',e=>{state.query=e.target.value.toLowerCase();renderChats()});
$$('.filter').forEach(b=>b.addEventListener('click',()=>{state.filter=b.dataset.filter;$$('.filter').forEach(x=>x.classList.toggle('active',x===b));renderChats()}));
$('#chatList').addEventListener('click',e=>{const row=e.target.closest('[data-phone]');if(row)openChat(row.dataset.phone)});
$('#quickBtn').addEventListener('click',()=>{if(!state.quick.length){toast('Add quick replies in the Quick Replies page first');return}const menu=state.quick.map((q,i)=>`${i+1}. ${q.shortcut} — ${q.text}`).join('\n');const n=prompt('Choose quick reply number:\n'+menu);const q=state.quick[Number(n)-1];if(q){$('#messageInput').value=q.text;$('#messageInput').focus()}});
async function markRead(){if(!state.activePhone)return;try{await api(`/api/chats/${encodeURIComponent(state.activePhone)}/read`,{method:'POST',body:'{}'});let c=state.chats.find(x=>phoneOf(x)===state.activePhone);if(c)c.unreadCount=0;renderChats();toast('Conversation marked as read')}catch(e){toast(e.message,true)}}
function editLabel(){const p=state.activePhone;if(!p)return;const current=labelOf(p);const label=prompt('Label for this chat (leave blank to remove):\nExamples: New Customer, Order Received, Payment Pending, Completed',current);if(label===null)return;if(label.trim())state.labels[p]=label.trim();else delete state.labels[p];save('wbi_labels',state.labels);renderChats();const c=state.chats.find(x=>phoneOf(x)===p)||{phone:p,name:p};updateChatHeader(c);toast('Label saved in this browser')}
function setPage(page){state.page=page;$('#app').classList.remove('show-chat');$('#composer').classList.add('hidden');$$('.rail [data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const content=$('#content');$('#topbar').innerHTML=`<div class="who"><strong>${({dashboard:'Dashboard',contacts:'Customers',catalog:'Product Catalog',quick:'Quick Replies',settings:'Settings'})[page]||'Inbox'}</strong><small>WhatsApp Business workspace</small></div><button class="btn ghost" id="refreshBtn">↻ Refresh</button>`;$('#refreshBtn').onclick=()=>{refreshStatus();refreshChats();if(page==='dashboard')renderPage('dashboard');else renderPage(page)};renderPage(page)}
function renderPage(page){const content=$('#content');if(page==='dashboard'){const unread=state.chats.reduce((n,c)=>n+Number(c.unreadCount||0),0);content.innerHTML=`<div class="section-title"><h2>Business overview</h2><button class="btn primary" id="
