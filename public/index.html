<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Business Inbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        wa: {
                            light: '#00a884',
                            dark: '#005c4b',
                            bg: '#efeae2',
                            chat: '#f0f2f5',
                            panel: '#ffffff',
                            sidebar: '#f0f2f5',
                            darkbg: '#111b21',
                            darkpanel: '#202c33',
                            darkchat: '#0b141a',
                            darkhover: '#2a3942',
                            darktext: '#e9edef'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.2);
        }
        .whatsapp-bg {
            background-color: #efeae2;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%239C92AC' fill-opacity='0.05' fill-rule='evenodd'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E");
        }
        .dark .whatsapp-bg {
            background-color: #0b141a;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.02' fill-rule='evenodd'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4H6zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E");
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-gray-100 dark:bg-wa-darkbg text-gray-800 dark:text-wa-darktext font-sans antialiased select-none">

    <!-- App Container -->
    <div id="app" class="flex h-full w-full relative overflow-hidden">

        <!-- Left Navigation Bar -->
        <nav aria-label="Main Navigation" class="w-16 flex-shrink-0 bg-gray-200 dark:bg-wa-darkpanel border-r border-gray-300 dark:border-gray-800 flex flex-col justify-between items-center py-4 z-20">
            <div class="flex flex-col space-y-4 items-center">
                <button onclick="switchNavTab('chats')" id="nav-btn-chats" class="p-3 rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-wa-darkhover transition relative group" title="Chats">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                    <span class="absolute left-16 bg-gray-900 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition pointer-events-none whitespace-nowrap z-50">Chats</span>
                </button>
                <button onclick="switchNavTab('quick-replies')" id="nav-btn-quick-replies" class="p-3 rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-wa-darkhover transition relative group" title="Quick Replies">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    <span class="absolute left-16 bg-gray-900 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition pointer-events-none whitespace-nowrap z-50">Quick Replies</span>
                </button>
                <button onclick="switchNavTab('greetings')" id="nav-btn-greetings" class="p-3 rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-wa-darkhover transition relative group" title="Greeting Message">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span class="absolute left-16 bg-gray-900 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition pointer-events-none whitespace-nowrap z-50">Greeting Message</span>
                </button>
            </div>
            <div class="flex flex-col space-y-4 items-center">
                <button onclick="toggleDemoMode()" id="nav-btn-demo" class="p-3 rounded-xl text-amber-600 hover:bg-amber-100 dark:hover:bg-wa-darkhover transition relative group" title="Toggle Demo Mode">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    <span class="absolute left-16 bg-gray-900 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition pointer-events-none whitespace-nowrap z-50">Demo Mode</span>
                </button>
                <button onclick="openSettingsModal()" class="p-3 rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-wa-darkhover transition relative group" title="Business Settings">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    <span class="absolute left-16 bg-gray-900 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition pointer-events-none whitespace-nowrap z-50">Settings</span>
                </button>
                <button onclick="toggleDarkMode()" class="p-3 rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-wa-darkhover transition relative group" title="Toggle Dark/Light Mode">
                    <svg id="theme-icon-light" class="w-6 h-6 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <svg id="theme-icon-dark" class="w-6 h-6 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    <span class="absolute left-16 bg-gray-900 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition pointer-events-none whitespace-nowrap z-50">Toggle Theme</span>
                </button>
            </div>
        </nav>

        <!-- Secondary Panel (Chat List or Management Views) -->
        <div id="secondary-panel" class="w-full md:w-80 lg:w-96 flex-shrink-0 bg-white dark:bg-wa-darkpanel border-r border-gray-300 dark:border-gray-800 flex flex-col z-10">
            <!-- Dynamic Secondary Content injected here -->
        </div>

        <!-- Main Workspace Area (Chat Conversation or Empty State) -->
        <div id="main-workspace" class="flex-1 flex flex-col bg-gray-50 dark:bg-wa-darkchat relative h-full">
            <!-- Dynamic Workspace Content injected here -->
        </div>

        <!-- Right Customer Info Panel (Toggleable) -->
        <aside aria-label="Customer Information" id="info-panel" class="hidden lg:flex w-80 flex-shrink-0 bg-white dark:bg-wa-darkpanel border-l border-gray-300 dark:border-gray-800 flex-col z-10">
            <!-- Dynamic Info Content injected here -->
        </aside>

    </div>

    <!-- Modals Container -->
    <div id="modal-container"></div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- Application Logic Script -->
    <script>
        /**
         * WhatsApp Business Inbox - Single File Application
         * Architecture: State-driven Vanilla JS with LocalStorage persistence & Meta Cloud API integration.
         */

        // --- Application State ---
        const STORAGE_VERSION = 'v1.0';
        const STORAGE_PREFIX = 'wa_bus_inbox_';

        let state = {
            activeNav: 'chats', // 'chats', 'quick-replies', 'greetings'
            activeChatId: null,
            filter: 'all', // 'all', 'unread', 'starred', 'archived'
            searchQuery: '',
            demoMode: false,
            darkMode: false,
            infoPanelOpen: true,
            settings: {
                phoneNumberId: '1392350110630223',
                wabaId: '',
                apiVersion: 'v17.0',
                token: '' // Session only, not persisted
            },
            chats: [],
            quickReplies: [
                { id: 'qr_1', shortcut: '/hello', title: 'Welcome Greeting', body: 'Hello! Thank you for contacting us. How can we help you today?' },
                { id: 'qr_2', shortcut: '/price', title: 'Pricing Inquiry', body: 'Thank you for your interest! Please tell us which product you would like to know more about.' },
                { id: 'qr_3', shortcut: '/payment', title: 'Payment Reference', body: 'Thank you for contacting us. Please share your order or payment reference so we can assist you.' },
                { id: 'qr_4', shortcut: '/thanks', title: 'Appreciation', body: 'Thank you for contacting us. We appreciate your support!' }
            ],
            greetings: {
                enabled: false,
                template: 'Hello {{name}}! Thanks for reaching out to us. How can we assist you today?'
            }
        };

        // --- Initial Mock Data for Demo Mode ---
        const DEMO_CHATS = [
            {
                id: 'demo_1',
                name: 'Aarav Sharma',
                phone: '919876543210',
                isDemo: true,
                unreadCount: 1,
                isStarred: true,
                isArchived: false,
                labels: ['VIP Customer', 'Pending Order'],
                notes: 'Interested in enterprise bulk pricing. Prefers communication via WhatsApp.',
                messages: [
                    { id: 'm1', direction: 'in', text: 'Hi, I need assistance with my recent software license order.', timestamp: Date.now() - 3600000 * 2, status: 'read' },
                    { id: 'm2', direction: 'out', text: 'Hello Aarav! Thank you for contacting us. How can we help you today?', timestamp: Date.now() - 3600000, status: 'delivered', apiMsgId: 'wamid.demo1' },
                    { id: 'm3', direction: 'in', text: 'Can you send me the invoice for transaction #9842?', timestamp: Date.now() - 1800000, status: 'read' }
                ]
            },
            {
                id: 'demo_2',
                name: 'Priya Patel',
                phone: '919123456789',
                isDemo: true,
                unreadCount: 0,
                isStarred: false,
                isArchived: false,
                labels: ['New Lead'],
                notes: 'Inquired about custom API integrations.',
                messages: [
                    { id: 'm4', direction: 'in', text: 'Hello, do you provide custom webhook integrations?', timestamp: Date.now() - 86400000, status: 'read' },
                    { id: 'm5', direction: 'out', text: 'Thank you for your interest! Please tell us which product you would like to know more about.', timestamp: Date.now() - 85000000, status: 'read', apiMsgId: 'wamid.demo2' }
                ]
            }
        ];

        // --- Initialization ---
        window.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();
            detectTheme();
            render();
            
            // Check if default phone number id is prefilled in settings
            if(!state.settings.phoneNumberId) {
                state.settings.phoneNumberId = '1392350110630223';
            }
        });

        // --- LocalStorage Management ---
        function loadFromLocalStorage() {
            try {
                const savedChats = localStorage.getItem(STORAGE_PREFIX + 'chats');
                const savedQR = localStorage.getItem(STORAGE_PREFIX + 'quick_replies');
                const savedGreetings = localStorage.getItem(STORAGE_PREFIX + 'greetings');
                const savedTheme = localStorage.getItem(STORAGE_PREFIX + 'dark_mode');

                if (savedChats) state.chats = JSON.parse(savedChats);
                if (savedQR) state.quickReplies = JSON.parse(savedQR);
                if (savedGreetings) state.greetings = JSON.parse(savedGreetings);
                if (savedTheme !== null) state.darkMode = JSON.parse(savedTheme);
            } catch (e) {
                console.error('Error loading from LocalStorage:', e);
                showToast('Error loading saved data. Resetting to defaults.', 'error');
            }
        }

        function saveToLocalStorage() {
            try {
                localStorage.setItem(STORAGE_PREFIX + 'chats', JSON.stringify(state.chats));
                localStorage.setItem(STORAGE_PREFIX + 'quick_replies', JSON.stringify(state.quickReplies));
                localStorage.setItem(STORAGE_PREFIX + 'greetings', JSON.stringify(state.greetings));
                localStorage.setItem(STORAGE_PREFIX + 'dark_mode', JSON.stringify(state.darkMode));
            } catch (e) {
                console.error('Error saving to LocalStorage:', e);
                showToast('Storage limit reached or unavailable.', 'error');
            }
        }

        function exportData() {
            const exportObj = {
                version: STORAGE_VERSION,
                timestamp: new Date().toISOString(),
                chats: state.chats,
                quickReplies: state.quickReplies,
                greetings: state.greetings
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObj, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `wa_business_backup_${Date.now()}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast('Backup exported successfully.', 'success');
        }

        function importData(event) {
            const fileReader = new FileReader();
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = (e) => {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        if (parsed.chats && Array.isArray(parsed.chats)) {
                            state.chats = parsed.chats;
                            if (parsed.quickReplies) state.quickReplies = parsed.quickReplies;
                            if (parsed.greetings) state.greetings = parsed.greetings;
                            saveToLocalStorage();
                            render();
                            showToast('Data imported successfully.', 'success');
                        } else {
                            throw new Error('Invalid backup file structure.');
                        }
                    } catch (err) {
                        showToast('Failed to parse backup file.', 'error');
                    }
                };
            }
        }

        // --- Theme Management ---
        function detectTheme() {
            if (state.darkMode) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function toggleDarkMode() {
            state.darkMode = !state.darkMode;
            detectTheme();
            saveToLocalStorage();
            render();
        }

        function toggleDemoMode() {
            state.demoMode = !state.demoMode;
            if (state.demoMode) {
                // Merge demo chats if not present
                DEMO_CHATS.forEach(dc => {
                    if (!state.chats.some(c => c.id === dc.id)) {
                        state.chats.unshift(dc);
                    }
                });
                showToast('Demo Mode Enabled. Sample conversations loaded.', 'info');
            } else {
                state.chats = state.chats.filter(c => !c.isDemo);
                showToast('Demo Mode Disabled.', 'info');
            }
            if (state.activeChatId && !state.chats.some(c => c.id === state.activeChatId)) {
                state.activeChatId = state.chats.length > 0 ? state.chats[0].id : null;
            }
            render();
        }

        // --- Navigation Controller ---
        function switchNavTab(tab) {
            state.activeNav = tab;
            renderSecondaryPanel();
            updateNavUI();
        }

        function updateNavUI() {
            ['chats', 'quick-replies', 'greetings'].forEach(tab => {
                const btn = document.getElementById(`nav-btn-${tab}`);
                if (btn) {
                    if (state.activeNav === tab) {
                        btn.classList.add('bg-gray-300', 'dark:bg-wa-darkhover', 'text-wa-light');
                    } else {
                        btn.classList.remove('bg-gray-300', 'dark:bg-wa-darkhover', 'text-wa-light');
                    }
                }
            });
        }

        // --- Master Render Function ---
        function render() {
            updateNavUI();
            renderSecondaryPanel();
            renderMainWorkspace();
            renderInfoPanel();
        }

        // --- Secondary Panel Renderer ---
        function renderSecondaryPanel() {
            const panel = document.getElementById('secondary-panel');
            if (!panel) return;

            if (state.activeNav === 'chats') {
                panel.innerHTML = `
                    <div class="p-4 border-b border-gray-200 dark:border-gray-800 flex flex-col space-y-3">
                        <div class="flex items-center justify-between">
                            <h1 class="text-xl font-bold text-gray-900 dark:text-white">Chats</h1>
                            <div clas
